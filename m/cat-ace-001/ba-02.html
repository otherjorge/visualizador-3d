:root{color-scheme:light;--azul:#005BAB;--azul-esc:#003B73;--verde:#005BAB;--tinta:#18222E;--cinza:#5B6775;--cinza-cl:#8C97A3;--linha:#D9E0E7;--nevoa:#F3F6F9}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--tinta);font:15px 'Segoe UI',system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:3px solid var(--azul)}
header img{height:26px;display:block}
header .t{margin-left:auto;text-align:right;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza-cl);line-height:1.35}
header .t b{color:var(--azul)}
.tit{padding:14px 14px 2px}
.tit .c{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cinza-cl)}
.tit .c b{color:var(--azul)}
.tit h1{margin:4px 0 0;font-weight:300;font-size:25px;line-height:1.1;color:var(--azul)}
.tit h1 strong{font-weight:600;color:var(--azul-esc)}
.v3d{position:relative;height:58vh;min-height:300px;margin:10px 10px 6px;border:1px solid var(--linha);border-radius:10px;overflow:hidden;background:linear-gradient(#FBFCFD,#E6ECF1)}
#cv{width:100%;height:100%;display:block;touch-action:none}
.v3d .h{position:absolute;left:10px;bottom:7px;font-size:11px;color:var(--cinza);pointer-events:none}
.bts{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.bts button{background:rgba(255,255,255,.92);color:var(--azul-esc);border:1px solid var(--linha);border-radius:14px;padding:5px 11px;font:inherit;font-size:12px;font-weight:600}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--cinza);text-align:center;padding:20px}
.cotas{display:grid;grid-template-columns:repeat(4,1fr);margin:6px 10px 0;border:1px solid var(--linha);border-radius:10px;overflow:hidden}
.cotas div{padding:8px 4px;text-align:center;border-left:1px solid var(--linha)}
.cotas div:first-child{border-left:0}
.cotas span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza-cl)}
.cotas b{font-size:18px;font-weight:600;color:var(--azul-esc)}
.cotas small{font-size:11px;font-weight:400;color:var(--cinza);margin-left:2px}
h3{margin:18px 14px 6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--azul-esc)}
h3::before{content:"";display:block;width:26px;height:3px;background:var(--verde);margin-bottom:6px}
p{margin:0 14px;font-size:14px;line-height:1.5;color:var(--tinta)}
.esp{margin:0 14px;display:grid;gap:6px}
.esp div{display:flex;align-items:center;gap:10px;font-size:14px}
.esp b{min-width:58px;padding-left:6px;padding-right:6px;padding:3px 0;text-align:center;border-radius:6px;background:var(--nevoa);color:var(--azul-esc);font-size:14px}

ul{list-style:none;margin:0 14px;padding:0}
li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--linha);font-size:14px}
li i{font-style:normal;min-width:20px;height:20px;border-radius:50%;background:var(--azul);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
li em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;color:var(--azul)}
footer{margin:22px 14px 18px;padding-top:10px;border-top:1px solid var(--linha);color:var(--cinza-cl);font-size:11px;line-height:1.5}
footer a{color:var(--azul)}
</style></head><body>

<script>
window.onerror = function (m, f, l) { var e = document.getElementById("load"); if (e) { e.style.display = "flex"; e.textContent = "Erro ao abrir o 3D: " + m + " (linha " + l + ")"; } };

<script src="three170.js"></script>
<script>
(function () {
var D = JSON.parse(document.getElementById('dados').textContent), $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
$('tit').innerHTML = '<div class="c"><b>' + esc(D.cod) + '</b> · ' + esc(D.grp) + '</div><h1><strong>' + esc(D.nome) + '</strong> ' + esc(D.sub) + '</h1>';
$('cotas').innerHTML = D.cotas.map(function (c) { return '<div><span>' + esc(c[0]) + '</span><b>' + esc(c[1]) + '<small>' + esc(c[2]) + '</small></b></div>'; }).join('');
$('info').innerHTML = '<h3>Descrição</h3><p>' + esc(D.desc) + '</p>' +
  '<h3>Construção</h3><div class="esp">' + D.esp.map(function (e) { return '<div><b>' + esc(e[0]) + '</b>' + esc(e[1]) + '</div>'; }).join('') + '</div>' +
  (D.nota ? '<p style="margin-top:8px;font-size:13px;color:var(--cinza)">' + esc(D.nota) + '</p>' : '') +
  (D.fer.length ? '<h3>Instalação</h3><ul>' + D.fer.map(function (f, i) { return '<li><i>' + (i + 1) + '</i><span>' + esc(f[0]) + '</span><em>' + esc(f[1]) + '</em></li>'; }).join('') + '</ul>' : '');
$('ft').innerHTML = esc(D.rodape) + '<br><a href="../cat-ace-001-acessorios-navais">Ver todos os itens do catálogo</a>';
var THREE = window.THREE; if (!THREE) throw Error('three.js não carregou');
var s = atob($('bin').textContent.trim()), BIN = new Uint8Array(s.length);
for (var i = 0; i < s.length; i++) BIN[i] = s.charCodeAt(i);
var cv = $('cv'), R = new THREE.WebGLRenderer({canvas: cv, antialias: true, alpha: true});
R.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); R.setClearColor(0x000000, 0);
var S = new THREE.Scene(), C = new THREE.PerspectiveCamera(32, 1, 0.01, 100); C.up.set(0, 0, 1);
S.add(new THREE.HemisphereLight(0xffffff, 0xb4bcc6, 2.5));
var sol = new THREE.DirectionalLight(0xffffff, 1.2); sol.position.set(-4, -6, 9); S.add(sol);
var sol2 = new THREE.DirectionalLight(0xffffff, 0.6); sol2.position.set(5, 4, 3); S.add(sol2);
var bb = new THREE.Box3();
D.grupos.forEach(function (p) {
  var qv = new Uint16Array(BIN.buffer, p.v, p.nv * 3), pos = new Float32Array(p.nv * 3);
  for (var i = 0; i < p.nv * 3; i++) pos[i] = D.mn[i % 3] + qv[i] / 65535 * D.ex[i % 3];
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(p.i32 ? new Uint32Array(BIN.buffer, p.i, p.ni) : new Uint16Array(BIN.buffer, p.i, p.ni), 1));
  var mat = p.brilho ? new THREE.MeshPhongMaterial({color: p.cor, flatShading: true, shininess: p.brilho, specular: 0x666666})
                     : new THREE.MeshLambertMaterial({color: p.cor, flatShading: true});
  S.add(new THREE.Mesh(g, mat));
  S.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 28), new THREE.LineBasicMaterial({color: 0x2b3742, transparent: true, opacity: .45})));
  g.computeBoundingBox(); bb.union(g.boundingBox);
});
var c0 = bb.getCenter(new THREE.Vector3()), rr = bb.getSize(new THREE.Vector3()).length() / 2;
var orb = {t: c0.clone(), r: 3, th: D.th, ph: 0.42};
function cam() { var cp = Math.cos(orb.ph); C.position.set(orb.t.x + orb.r * cp * Math.cos(orb.th), orb.t.y + orb.r * cp * Math.sin(orb.th), orb.t.z + orb.r * Math.sin(orb.ph)); C.lookAt(orb.t); }
function enq() { var vf = THREE.MathUtils.degToRad(C.fov) / 2, hf = Math.atan(Math.tan(vf) * C.aspect); orb.r = rr / Math.sin(Math.min(vf, hf)) * 1.02; }
var pend = false;
function pedir() { if (!pend) { pend = true; requestAnimationFrame(function () { pend = false; cam(); R.render(S, C); }); } }
function resize() { var w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return; R.setSize(w, h, false); C.aspect = w / h; C.updateProjectionMatrix(); pedir(); }
window.addEventListener('resize', function () { resize(); });
function vista(th, ph) { orb.th = th; orb.ph = ph; orb.t = c0.clone(); enq(); pedir(); }
$('bv').onclick = function () { vista(D.th, 0.42); };
$('bf').onclick = function () { vista(D.frente, 0.06); };
var pts = new Map(), dist0 = 0, mid0 = null;
function pan(dx, dy) {
  var k = orb.r * 2 * Math.tan(THREE.MathUtils.degToRad(C.fov / 2)) / cv.clientHeight, dir = new THREE.Vector3(); C.getWorldDirection(dir);
  var r_ = new THREE.Vector3().crossVectors(dir, C.up).normalize(), u_ = new THREE.Vector3().crossVectors(r_, dir).normalize();
  orb.t.addScaledVector(r_, -dx * k).addScaledVector(u_, dy * k);
}
cv.addEventListener('pointerdown', function (e) {
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x: e.clientX, y: e.clientY, b: e.button});
  if (pts.size === 2) { var a = Array.from(pts.values()); dist0 = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); mid0 = {x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2}; }
});
cv.addEventListener('pointermove', function (e) {
  var p = pts.get(e.pointerId); if (!p) return; var dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 1) { if (p.b === 1 || p.b === 2) pan(dx, dy); else { orb.th -= dx * 0.008; orb.ph = Math.max(-1.55, Math.min(1.55, orb.ph + dy * 0.008)); } }
  else if (pts.size === 2) { var a = Array.from(pts.values()), d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), mm = {x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2};
    if (dist0) orb.r = Math.max(0.2, orb.r * dist0 / d); pan(mm.x - mid0.x, mm.y - mid0.y); dist0 = d; mid0 = mm; }
  pedir();
});
function solta(e) { pts.delete(e.pointerId); if (pts.size < 2) dist0 = 0; }
cv.addEventListener('pointerup', solta); cv.addEventListener('pointercancel', solta);
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
cv.addEventListener('wheel', function (e) { e.preventDefault(); orb.r = Math.max(0.2, orb.r * Math.pow(1.0015, e.deltaY)); pedir(); }, {passive: false});
resize(); enq(); pedir(); $('load').style.display = 'none';
})();
</script>
