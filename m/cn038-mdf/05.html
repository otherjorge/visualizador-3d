<style>
:root{color-scheme:dark;--bg:#0c151c;--panel:#111f28;--line:#293c48;--txt:#e6eef3;--muted:#9eb0bc;--accent:#55e0b4;--sel:#ff9f1c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px 'Segoe UI',system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header .logo{background:#fff;border-radius:6px;padding:3px 7px;display:flex}
header .logo img{height:24px;display:block}
header div.t{font-size:12px;color:var(--muted);line-height:1.3}
header div.t b{color:var(--txt);font-size:13px}
.tit{padding:12px 14px 4px}
.tit .n{color:var(--sel);font-weight:700;font-size:26px;line-height:1}
.tit .d{font-weight:700;font-size:18px;margin-top:4px}
.tit .c{color:var(--muted);font-size:13px}
.v3d{position:relative;height:56vh;min-height:280px;margin:8px 10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#162833}
#cv{width:100%;height:100%;display:block;touch-action:none}
.v3d .h{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--muted);pointer-events:none}
.v3d button{position:absolute;right:8px;top:8px;background:rgba(17,31,40,.9);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:5px 10px;font:inherit;font-size:12px}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:10px 14px;font-size:14px}
dt{color:var(--muted)}dd{margin:0}
.st{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:700;font-size:13px}
.ok{background:#C6EFCE;color:#006100}.sd{background:#FCE4D6;color:#C55A11}.fab{background:#FFFF00;color:#006100}
.obs{margin:4px 14px;color:var(--muted);font-size:12px}
a.lk{display:block;margin:14px;padding:12px;text-align:center;border:1px solid var(--accent);color:var(--accent);border-radius:10px;text-decoration:none;font-weight:600}
footer{color:var(--muted);font-size:11px;padding:0 14px 16px}

<script>
(function () {
var D = JSON.parse(document.getElementById('dados').textContent), it = D.item, $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
$('tit').innerHTML = '<div class="n">ITEM ' + esc(it.item) + '</div><div class="d">' + esc(it.desc) + '</div><div class="c">' + esc(it.cod) + ' · ' + esc(it.grupo) + '</div>';
var q = D.conveses.map(function (c, i) { return it.q[i] ? c.replace('CONVÉS ', 'Cv. ') + ': ' + it.q[i] : ''; }).filter(Boolean).join(' · ');
var pj = it.proj === 'SEM DESENHO' ? 'sd' : 'ok';
$('dl').innerHTML = '<dt>Dimensões</dt><dd>' + esc(it.dim) + ' mm <span style="color:var(--muted)">(C x P x A)</span></dd><dt>Material</dt><dd>' + esc(it.mat) +
  '</dd><dt>Aplicação</dt><dd>' + esc(it.amb) + '</dd><dt>Quantidade</dt><dd><b>' + it.tot + ' un</b><br><span style="color:var(--muted);font-size:13px">' + esc(q) +
  '</span></dd><dt>Projeto</dt><dd><span class="st ' + pj + '">' + esc(it.proj) + '</span></dd><dt>Fabricação</dt><dd><span class="st fab">' + esc(it.fab) +
  '</span></dd><dt>GRD</dt><dd>' + esc(it.grd) + '</dd>';
$('obs').textContent = D.obs || '';
$('ft').textContent = D.rodape;
var THREE = window.THREE; if (!THREE) throw Error('three.js não carregou');
var s = atob($('bin').textContent.trim()), BIN = new Uint8Array(s.length);
for (var i = 0; i < s.length; i++) BIN[i] = s.charCodeAt(i);
var p = D.peca, qv = new Uint16Array(BIN.buffer, p.v, p.nv * 3), pos = new Float32Array(p.nv * 3);
for (i = 0; i < p.nv * 3; i++) pos[i] = p.mn[i % 3] + qv[i] / 65535 * p.ex[i % 3];
var g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
g.setIndex(new THREE.BufferAttribute(p.i32 ? new Uint32Array(BIN.buffer, p.i, p.ni) : new Uint16Array(BIN.buffer, p.i, p.ni), 1));
var cv = $('cv'), R = new THREE.WebGLRenderer({canvas: cv, antialias: true});
R.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); R.setClearColor(0x162833);
var S = new THREE.Scene(), C = new THREE.PerspectiveCamera(35, 1, 0.01, 100); C.up.set(0, 0, 1);
S.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.7));
var sol = new THREE.DirectionalLight(0xffffff, 1.5); sol.position.set(3, -5, 8); S.add(sol);
var m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({color: D.cor, flatShading: true}));
m.matrixAutoUpdate = false; m.matrix.fromArray(D.m); S.add(m);
var ln = new THREE.LineSegments(new THREE.EdgesGeometry(g, 28), new THREE.LineBasicMaterial({color: 0x1b2730, transparent: true, opacity: .6}));
ln.matrixAutoUpdate = false; ln.matrix.copy(m.matrix); S.add(ln);
g.computeBoundingBox(); var bb = g.boundingBox.clone().applyMatrix4(m.matrix);
var orb = {t: bb.getCenter(new THREE.Vector3()), r: 3, th: -0.95, ph: 0.45}, rr = bb.getSize(new THREE.Vector3()).length() / 2;
function cam() { var cp = Math.cos(orb.ph); C.position.set(orb.t.x + orb.r * cp * Math.cos(orb.th), orb.t.y + orb.r * cp * Math.sin(orb.th), orb.t.z + orb.r * Math.sin(orb.ph)); C.lookAt(orb.t); }
function enq() { var vf = THREE.MathUtils.degToRad(C.fov) / 2, hf = Math.atan(Math.tan(vf) * C.aspect); orb.r = rr / Math.sin(Math.min(vf, hf)) * 1.05; }
var pend = false;
function pedir() { if (!pend) { pend = true; requestAnimationFrame(function () { pend = false; cam(); R.render(S, C); }); } }
function resize() { var w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return; R.setSize(w, h, false); C.aspect = w / h; C.updateProjectionMatrix(); pedir(); }
window.addEventListener('resize', function () { resize(); });
$('bv').onclick = function () { orb.th = -0.95; orb.ph = 0.45; orb.t = bb.getCenter(new THREE.Vector3()); enq(); pedir(); };
var pts = new Map(), dist0 = 0, mid0 = null;
function pan(dx, dy) {
  var k = orb.r * 2 * Math.tan(THREE.MathUtils.degToRad(C.fov / 2)) / cv.clientHeight, dir = new THREE.Vector3(); C.getWorldDirection(dir);
  var r_ = new THREE.Vector3().crossVectors(dir, C.up).normalize(), u_ = new THREE.Vector3().crossVectors(r_, dir).normalize();
  orb.t.addScaledVector(r_, -dx * k).addScaledVector(u_, dy * k);
}
cv.addEventListener('pointerdown', function (e) {
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x: e.clientX, y: e.clientY, b: e.button});
  if (pts.size === 2) { var a = Array.from(pts.values()); dist0 = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); mid0 = {x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2}; }
});
cv.addEventListener('pointermove', function (e) {
  var p = pts.get(e.pointerId); if (!p) return; var dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 1) { if (p.b === 1 || p.b === 2) pan(dx, dy); else { orb.th -= dx * 0.008; orb.ph = Math.max(-1.55, Math.min(1.55, orb.ph + dy * 0.008)); } }
  else if (pts.size === 2) { var a = Array.from(pts.values()), d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), mm = {x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2};
    if (dist0) orb.r = Math.max(0.2, orb.r * dist0 / d); pan(mm.x - mid0.x, mm.y - mid0.y); dist0 = d; mid0 = mm; }
  pedir();
});
function solta(e) { pts.delete(e.pointerId); if (pts.size < 2) dist0 = 0; }
cv.addEventListener('pointerup', solta); cv.addEventListener('pointercancel', solta);
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
cv.addEventListener('wheel', function (e) { e.preventDefault(); orb.r = Math.max(0.2, orb.r * Math.pow(1.0015, e.deltaY)); pedir(); }, {passive: false});
